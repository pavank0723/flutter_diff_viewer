name: flutter_diff_viewer
description: >
  A production-grade Flutter package providing GitHub/GitLab-style content
  comparison and diff viewing. Supports side-by-side, unified, and stacked
  layouts with line, word, and character-level diff granularity.
version: 1.0.0
homepage: https://github.com/pavank0723/flutter_diff_viewer
repository: https://github.com/pavank0723/flutter_diff_viewer
issue_tracker: https://github.com/pavank0723/flutter_diff_viewer/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
